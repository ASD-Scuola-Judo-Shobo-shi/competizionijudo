name: Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      deployment_ref:
        description: Full Git SHA to deploy or roll back to; blank uses the selected branch HEAD
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.deployment_ref || github.sha }}
      artifact_name: app-${{ github.run_id }}-${{ github.run_attempt }}

  deploy-production:
    name: Deploy production
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.competizionijudo.it

    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.ci.outputs.revision }}

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download application artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: build/deploy

      - name: Resolve production FTP target directory
        id: production-ftp-dir
        env:
          RAW_FTP_BASE_DIR: ${{ vars.FTP_BASE_DIR }}
          RAW_FTP_DEPLOY_DIR: ${{ vars.FTP_DEPLOY_DIR }}
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);

          $base = getenv('RAW_FTP_BASE_DIR');
          $deploy = getenv('RAW_FTP_DEPLOY_DIR');
          if ($base === false || trim($base) === '' || $deploy === false || trim($deploy) === '') {
              fwrite(STDERR, "FTP_BASE_DIR and FTP_DEPLOY_DIR are required.\n");
              exit(1);
          }
          $value = trim($base) . '/' . trim($deploy);

          if (in_array($value, ['.', './', '/'], true)) {
              fwrite(STDERR, "FTP_BASE_DIR/FTP_DEPLOY_DIR must point to a dedicated application directory relative to the FTP login root, for example competizionijudo/prod/." . PHP_EOL);
              exit(1);
          }

          if (str_contains($value, '..')) {
              fwrite(STDERR, "FTP_BASE_DIR and FTP_DEPLOY_DIR must not contain parent-directory segments." . PHP_EOL);
              exit(1);
          }

          $value = ltrim($value, '/');
          $value = preg_replace('#/+#', '/', $value);
          $value = rtrim((string) $value, '/') . '/';

          if ($value === '/') {
              fwrite(STDERR, "FTP_BASE_DIR/FTP_DEPLOY_DIR resolved to the FTP root, which is not allowed." . PHP_EOL);
              exit(1);
          }

          $outputPath = getenv('GITHUB_OUTPUT');
          if ($outputPath === false || $outputPath === '') {
              fwrite(STDERR, "GITHUB_OUTPUT is not available." . PHP_EOL);
              exit(1);
          }

          file_put_contents($outputPath, "path={$value}" . PHP_EOL, FILE_APPEND);
          PHP

      - name: Stage and verify root router (.htaccess + index.php)
        run: bash scripts/stage-root-router.sh build/root-router

      - name: Upload to production FTP directory
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.production-ftp-dir.outputs.path }}
        run: bash scripts/lftp-upload.sh deploy "$REMOTE_DIR"

      - name: Verify production application artifact over FTPS
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.production-ftp-dir.outputs.path }}
          FTP_VERIFY_RETRIES: ${{ vars.FTP_VERIFY_RETRIES || 4 }}
        run: |
          if [[ ! "$FTP_VERIFY_RETRIES" =~ ^[0-9]+$ ]] || (( FTP_VERIFY_RETRIES < 4 )); then
            echo 'FTP_VERIFY_RETRIES must be an integer of at least 4.' >&2
            exit 2
          fi
          FTP_MISMATCH_FILE="$RUNNER_TEMP/production-ftp-mismatches.txt"
          rm -f "$FTP_MISMATCH_FILE"
          for attempt in $(seq 0 "$FTP_VERIFY_RETRIES"); do
            if FTP_MISMATCH_FILE="$FTP_MISMATCH_FILE" bash scripts/lftp-upload.sh verify "$REMOTE_DIR" build/deploy; then
              exit 0
            fi
            if (( attempt == FTP_VERIFY_RETRIES )); then
              echo "Artifact verification failed after ${FTP_VERIFY_RETRIES} targeted repair attempts." >&2
              exit 1
            fi
            [[ -s "$FTP_MISMATCH_FILE" ]] || { echo 'Verification did not identify files for targeted repair.' >&2; exit 1; }
            echo "Read-back mismatch; targeted production repair attempt $((attempt + 1))/${FTP_VERIFY_RETRIES}."
            bash scripts/lftp-upload.sh repair "$REMOTE_DIR" build/deploy "$FTP_MISMATCH_FILE"
          done

      - name: Render runtime .env
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_URL: ${{ format('{0}prod', vars.APP_URL) }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_USER: ${{ vars.ADMIN_USER }}
          ADMIN_PASS_HASH: ${{ secrets.ADMIN_PASS_HASH }}
          MIGRATIONS_TOKEN: ${{ secrets.MIGRATIONS_TOKEN }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          APP_OWNER: ${{ vars.APP_OWNER }}
          APP_OWNER_ADDRESS: ${{ vars.APP_OWNER_ADDRESS }}
          APP_OWNER_FISCAL_CODE: ${{ vars.APP_OWNER_FISCAL_CODE }}
          APP_OWNER_EMAIL: ${{ vars.APP_OWNER_EMAIL }}
          APP_WEBHOST: ${{ vars.APP_WEBHOST }}
          APP_WEBHOST_LOCATION: ${{ vars.APP_WEBHOST_LOCATION }}
          APP_LOG_RETENTION_DAYS: ${{ vars.APP_LOG_RETENTION_DAYS }}
          APP_BACKUP_RETENTION_DAYS: ${{ vars.APP_BACKUP_RETENTION_DAYS }}
        run: php scripts/render-deploy-env.php build/runtime-env

      - name: Upload production runtime env
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.production-ftp-dir.outputs.path }}
        run: bash scripts/lftp-upload.sh env "$REMOTE_DIR"

      - name: Verify production runtime env over FTPS
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.production-ftp-dir.outputs.path }}
        run: bash scripts/lftp-upload.sh verify "$REMOTE_DIR" build/runtime-env

      - name: Upload root router to host root
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_BASE_DIR: ${{ vars.FTP_BASE_DIR }}
        run: bash scripts/lftp-upload.sh root "$FTP_BASE_DIR"

      - name: Verify root router over FTPS
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_BASE_DIR: ${{ vars.FTP_BASE_DIR }}
        run: bash scripts/lftp-upload.sh verify "$FTP_BASE_DIR" build/root-router

      - name: Run production migrations on the hosting server
        env:
          MIGRATION_ENDPOINT_URL: ${{ vars.MIGRATIONS_URL || format('{0}prod/migrations/', vars.APP_URL) }}
          MIGRATIONS_TOKEN: ${{ secrets.MIGRATIONS_TOKEN }}
        run: bash scripts/trigger-server-migrations.sh

      - name: Verify production health and revision
        run: >-
          bash scripts/check-deployment-health.sh
          "${{ vars.PRODUCTION_HEALTH_URL || 'https://www.competizionijudo.it/prod/health' }}"
          "${{ needs.ci.outputs.revision }}"

  deploy-development:
    name: Deploy development
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.competizionijudo.it

    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.ci.outputs.revision }}

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download application artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: build/deploy

      - name: Resolve development FTP target directory
        id: development-ftp-dir
        env:
          RAW_FTP_BASE_DIR: ${{ vars.FTP_BASE_DIR }}
          RAW_FTP_DEPLOY_DIR: ${{ vars.FTP_DEPLOY_DIR }}
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);

          $base = getenv('RAW_FTP_BASE_DIR');
          $deploy = getenv('RAW_FTP_DEPLOY_DIR');
          if ($base === false || trim($base) === '' || $deploy === false || trim($deploy) === '') {
              fwrite(STDERR, "FTP_BASE_DIR and FTP_DEPLOY_DIR are required.\n");
              exit(1);
          }
          $value = trim($base) . '/' . trim($deploy);

          if (in_array($value, ['.', './', '/'], true)) {
              fwrite(STDERR, "FTP_BASE_DIR/FTP_DEPLOY_DIR must point to a dedicated application directory relative to the FTP login root, for example competizionijudo/dev/." . PHP_EOL);
              exit(1);
          }

          if (str_contains($value, '..')) {
              fwrite(STDERR, "FTP_BASE_DIR and FTP_DEPLOY_DIR must not contain parent-directory segments." . PHP_EOL);
              exit(1);
          }

          $value = ltrim($value, '/');
          $value = preg_replace('#/+#', '/', $value);
          $value = rtrim((string) $value, '/') . '/';

          if ($value === '/') {
              fwrite(STDERR, "FTP_BASE_DIR/FTP_DEPLOY_DIR resolved to the FTP root, which is not allowed." . PHP_EOL);
              exit(1);
          }

          $outputPath = getenv('GITHUB_OUTPUT');
          if ($outputPath === false || $outputPath === '') {
              fwrite(STDERR, "GITHUB_OUTPUT is not available." . PHP_EOL);
              exit(1);
          }

          file_put_contents($outputPath, "path={$value}" . PHP_EOL, FILE_APPEND);
          PHP

      - name: Upload to development FTP directory
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.development-ftp-dir.outputs.path }}
        run: bash scripts/lftp-upload.sh deploy "$REMOTE_DIR"

      - name: Verify development application artifact over FTPS
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.development-ftp-dir.outputs.path }}
          FTP_VERIFY_RETRIES: ${{ vars.FTP_VERIFY_RETRIES || 4 }}
        run: |
          if [[ ! "$FTP_VERIFY_RETRIES" =~ ^[0-9]+$ ]] || (( FTP_VERIFY_RETRIES < 4 )); then
            echo 'FTP_VERIFY_RETRIES must be an integer of at least 4.' >&2
            exit 2
          fi
          FTP_MISMATCH_FILE="$RUNNER_TEMP/development-ftp-mismatches.txt"
          rm -f "$FTP_MISMATCH_FILE"
          for attempt in $(seq 0 "$FTP_VERIFY_RETRIES"); do
            if FTP_MISMATCH_FILE="$FTP_MISMATCH_FILE" bash scripts/lftp-upload.sh verify "$REMOTE_DIR" build/deploy; then
              exit 0
            fi
            if (( attempt == FTP_VERIFY_RETRIES )); then
              echo "Artifact verification failed after ${FTP_VERIFY_RETRIES} targeted repair attempts." >&2
              exit 1
            fi
            [[ -s "$FTP_MISMATCH_FILE" ]] || { echo 'Verification did not identify files for targeted repair.' >&2; exit 1; }
            echo "Read-back mismatch; targeted development repair attempt $((attempt + 1))/${FTP_VERIFY_RETRIES}."
            bash scripts/lftp-upload.sh repair "$REMOTE_DIR" build/deploy "$FTP_MISMATCH_FILE"
          done

      - name: Render runtime .env
        env:
          APP_ENV: development
          APP_DEBUG: "false"
          APP_URL: ${{ format('{0}dev', vars.APP_URL) }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_USER: ${{ vars.ADMIN_USER }}
          ADMIN_PASS_HASH: ${{ secrets.ADMIN_PASS_HASH }}
          MIGRATIONS_TOKEN: ${{ secrets.MIGRATIONS_TOKEN }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          APP_OWNER: ${{ vars.APP_OWNER }}
          APP_OWNER_ADDRESS: ${{ vars.APP_OWNER_ADDRESS }}
          APP_OWNER_FISCAL_CODE: ${{ vars.APP_OWNER_FISCAL_CODE }}
          APP_OWNER_EMAIL: ${{ vars.APP_OWNER_EMAIL }}
          APP_WEBHOST: ${{ vars.APP_WEBHOST }}
          APP_WEBHOST_LOCATION: ${{ vars.APP_WEBHOST_LOCATION }}
          APP_LOG_RETENTION_DAYS: ${{ vars.APP_LOG_RETENTION_DAYS }}
          APP_BACKUP_RETENTION_DAYS: ${{ vars.APP_BACKUP_RETENTION_DAYS }}
        run: php scripts/render-deploy-env.php build/runtime-env

      - name: Upload development runtime env
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.development-ftp-dir.outputs.path }}
        run: bash scripts/lftp-upload.sh env "$REMOTE_DIR"

