name: Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      deployment_ref:
        description: Full Git SHA to deploy or roll back to; blank uses the selected branch HEAD
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.deployment_ref || github.sha }}
      artifact_name: app-${{ github.run_id }}-${{ github.run_attempt }}

  migrate_production:
    name: Run production migrations
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Setup PHP with MySQL support
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql
          coverage: none

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: build/deploy

      - name: Validate automatic migration safety
        run: php build/deploy/scripts/check-automatic-migrations.php

      - name: Run production migrations against MySQL
        env:
          DB_HOST: ${{ vars.MIGRATION_DB_HOST || vars.DB_HOST }}
          DB_NAME: ${{ vars.MIGRATION_DB_NAME || vars.DB_NAME }}
          DB_USER: ${{ vars.MIGRATION_DB_USER || vars.DB_USER }}
          DB_PASS: ${{ secrets.MIGRATION_DB_PASS || secrets.DB_PASS }}
        run: php build/deploy/scripts/run-migrations.php

  deploy-production:
    name: Deploy production
    needs: [ci, migrate_production]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.ci.result == 'success' && needs.migrate_production.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.competizionijudo.it

    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci.outputs.revision }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: build/deploy

      - name: Resolve production FTP target directory
        id: production-ftp-dir
        env:
          RAW_FTP_DIR: ${{ vars.FTP_BASE_DIR }}/${{ vars.FTP_PROD_DIR }}
          DEFAULT_FTP_DIR: prod/
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);

          $raw = getenv('RAW_FTP_DIR');
          $default = getenv('DEFAULT_FTP_DIR') ?: 'prod/';
          $value = $raw === false || trim($raw) === '' ? $default : trim($raw);

          if (in_array($value, ['.', './', '/'], true)) {
              fwrite(STDERR, "FTP_BASE_DIR/FTP_PROD_DIR must point to a dedicated application directory relative to the FTP login root, for example prod/." . PHP_EOL);
              exit(1);
          }

          if (str_contains($value, '..')) {
              fwrite(STDERR, "FTP_BASE_DIR/FTP_PROD_DIR must not contain parent-directory segments." . PHP_EOL);
              exit(1);
          }

          $value = ltrim($value, '/');
          $value = preg_replace('#/+#', '/', $value);
          $value = rtrim((string) $value, '/') . '/';

          if ($value === '/') {
              fwrite(STDERR, "FTP_BASE_DIR/FTP_PROD_DIR resolved to the FTP root, which is not allowed." . PHP_EOL);
              exit(1);
          }

          $outputPath = getenv('GITHUB_OUTPUT');
          if ($outputPath === false || $outputPath === '') {
              fwrite(STDERR, "GITHUB_OUTPUT is not available." . PHP_EOL);
              exit(1);
          }

          file_put_contents($outputPath, "path={$value}" . PHP_EOL, FILE_APPEND);
          PHP

      - name: Stage root router (.htaccess + index.php)
        run: bash scripts/stage-root-router.sh build/root-router

      - name: Verify staged root router
        run: |
          test -s build/root-router/.htaccess
          test -s build/root-router/index.php
          cd build/root-router
          sha256sum --check --strict router.sha256
          rm router.sha256
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 2

      - name: Upload to production FTP directory
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.production-ftp-dir.outputs.path }}
        run: bash scripts/lftp-upload.sh deploy "$REMOTE_DIR"

      - name: Render runtime .env
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_URL: ${{ vars.APP_URL }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_USER: ${{ vars.ADMIN_USER }}
          ADMIN_PASS_HASH: ${{ secrets.ADMIN_PASS_HASH }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          APP_OWNER: ${{ vars.APP_OWNER }}
          APP_OWNER_ADDRESS: ${{ vars.APP_OWNER_ADDRESS }}
          APP_OWNER_FISCAL_CODE: ${{ vars.APP_OWNER_FISCAL_CODE }}
          APP_OWNER_EMAIL: ${{ vars.APP_OWNER_EMAIL }}
          APP_WEBHOST: ${{ vars.APP_WEBHOST }}
          APP_WEBHOST_LOCATION: ${{ vars.APP_WEBHOST_LOCATION }}
          APP_LOG_RETENTION_DAYS: ${{ vars.APP_LOG_RETENTION_DAYS }}
          APP_BACKUP_RETENTION_DAYS: ${{ vars.APP_BACKUP_RETENTION_DAYS }}
        run: php scripts/render-deploy-env.php build/runtime-env

      - name: Upload production runtime env
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.production-ftp-dir.outputs.path }}
        run: bash scripts/lftp-upload.sh env "$REMOTE_DIR"

      - name: Upload root router to host root
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_BASE_DIR: ${{ vars.FTP_BASE_DIR }}
        run: bash scripts/lftp-upload.sh root "$FTP_BASE_DIR"

      - name: Verify production health and revision
        run: >-
          bash scripts/check-deployment-health.sh
          "${{ vars.PRODUCTION_HEALTH_URL || 'https://www.competizionijudo.it/prod/health' }}"
          "${{ needs.ci.outputs.revision }}"

  migrate_development:
    name: Run development migrations
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Setup PHP with MySQL support
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql
          coverage: none

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: build/deploy

      - name: Validate automatic migration safety
        run: php build/deploy/scripts/check-automatic-migrations.php

      - name: Run development migrations against MySQL
        env:
          DB_HOST: ${{ vars.MIGRATION_DB_HOST || vars.DB_HOST }}
          DB_NAME: ${{ vars.MIGRATION_DB_NAME || vars.DB_NAME }}
          DB_USER: ${{ vars.MIGRATION_DB_USER || vars.DB_USER }}
          DB_PASS: ${{ secrets.MIGRATION_DB_PASS || secrets.DB_PASS }}
        run: php build/deploy/scripts/run-migrations.php

  deploy-development:
    name: Deploy development
    needs: [ci, migrate_development]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && needs.ci.result == 'success' && needs.migrate_development.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.competizionijudo.it

    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci.outputs.revision }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: build/deploy

      - name: Resolve development FTP target directory
        id: development-ftp-dir
        env:
          RAW_FTP_DIR: ${{ vars.FTP_BASE_DIR }}/${{ vars.FTP_DEV_DIR }}
          DEFAULT_FTP_DIR: dev/
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);

          $raw = getenv('RAW_FTP_DIR');
          $default = getenv('DEFAULT_FTP_DIR') ?: 'dev/';
          $value = $raw === false || trim($raw) === '' ? $default : trim($raw);

          if (in_array($value, ['.', './', '/'], true)) {
              fwrite(STDERR, "FTP_BASE_DIR/FTP_DEV_DIR must point to a dedicated application directory relative to the FTP login root, for example dev/." . PHP_EOL);
              exit(1);
          }

          if (str_contains($value, '..')) {
              fwrite(STDERR, "FTP_BASE_DIR/FTP_DEV_DIR must not contain parent-directory segments." . PHP_EOL);
              exit(1);
          }

          $value = ltrim($value, '/');
          $value = preg_replace('#/+#', '/', $value);
          $value = rtrim((string) $value, '/') . '/';

          if ($value === '/') {
              fwrite(STDERR, "FTP_BASE_DIR/FTP_DEV_DIR resolved to the FTP root, which is not allowed." . PHP_EOL);
              exit(1);
          }

          $outputPath = getenv('GITHUB_OUTPUT');
          if ($outputPath === false || $outputPath === '') {
              fwrite(STDERR, "GITHUB_OUTPUT is not available." . PHP_EOL);
              exit(1);
          }

          file_put_contents($outputPath, "path={$value}" . PHP_EOL, FILE_APPEND);
          PHP

      - name: Upload to development FTP directory
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.development-ftp-dir.outputs.path }}
        run: bash scripts/lftp-upload.sh deploy "$REMOTE_DIR"

      - name: Render runtime .env
        env:
          APP_ENV: development
          APP_DEBUG: "false"
          APP_URL: ${{ vars.APP_URL }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_USER: ${{ vars.ADMIN_USER }}
          ADMIN_PASS_HASH: ${{ secrets.ADMIN_PASS_HASH }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          APP_OWNER: ${{ vars.APP_OWNER }}
          APP_OWNER_ADDRESS: ${{ vars.APP_OWNER_ADDRESS }}
          APP_OWNER_FISCAL_CODE: ${{ vars.APP_OWNER_FISCAL_CODE }}
          APP_OWNER_EMAIL: ${{ vars.APP_OWNER_EMAIL }}
          APP_WEBHOST: ${{ vars.APP_WEBHOST }}
          APP_WEBHOST_LOCATION: ${{ vars.APP_WEBHOST_LOCATION }}
          APP_LOG_RETENTION_DAYS: ${{ vars.APP_LOG_RETENTION_DAYS }}
          APP_BACKUP_RETENTION_DAYS: ${{ vars.APP_BACKUP_RETENTION_DAYS }}
        run: php scripts/render-deploy-env.php build/runtime-env

      - name: Upload development runtime env
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.development-ftp-dir.outputs.path }}
        run: bash scripts/lftp-upload.sh env "$REMOTE_DIR"

      - name: Verify development health and revision
        run: >-
          bash scripts/check-deployment-health.sh
          "${{ vars.DEVELOPMENT_HEALTH_URL || 'https://www.competizionijudo.it/dev/health' }}"
          "${{ needs.ci.outputs.revision }}"
