name: Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      deployment_ref:
        description: Full Git SHA to deploy or roll back to; blank uses the selected branch HEAD
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.deployment_ref || github.sha }}
      artifact_name: app-${{ github.run_id }}-${{ github.run_attempt }}

  deploy-production:
    name: Deploy production
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.competizionijudo.it

    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci.outputs.revision }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: build/deploy

      - name: Resolve production FTP target directory
        id: production-ftp-dir
        env:
          RAW_FTP_DIR: ${{ vars.FTP_PROD_DIR }}
          DEFAULT_FTP_DIR: prod/
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);

          $raw = getenv('RAW_FTP_DIR');
          $default = getenv('DEFAULT_FTP_DIR') ?: 'prod/';
          $value = $raw === false || trim($raw) === '' ? $default : trim($raw);

          if (in_array($value, ['.', './', '/'], true)) {
              fwrite(STDERR, "FTP_PROD_DIR must point to a dedicated application directory relative to the FTP login root, for example prod/." . PHP_EOL);
              exit(1);
          }

          if (str_contains($value, '..')) {
              fwrite(STDERR, "FTP_PROD_DIR must not contain parent-directory segments." . PHP_EOL);
              exit(1);
          }

          $value = ltrim($value, '/');
          $value = preg_replace('#/+#', '/', $value);
          $value = rtrim((string) $value, '/') . '/';

          if ($value === '/') {
              fwrite(STDERR, "FTP_PROD_DIR resolved to the FTP root, which is not allowed." . PHP_EOL);
              exit(1);
          }

          $outputPath = getenv('GITHUB_OUTPUT');
          if ($outputPath === false || $outputPath === '') {
              fwrite(STDERR, "GITHUB_OUTPUT is not available." . PHP_EOL);
              exit(1);
          }

          file_put_contents($outputPath, "path={$value}" . PHP_EOL, FILE_APPEND);
          PHP

      - name: Stage production root htaccess
        run: bash scripts/stage-root-router.sh build/root-htaccess

      - name: Verify staged root htaccess
        run: |
          test -s build/root-htaccess/.htaccess
          cd build/root-htaccess
          sha256sum --check --strict htaccess.sha256
          rm htaccess.sha256
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 1

      - name: Upload to production FTP directory
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.production-ftp-dir.outputs.path }}
        run: |
          lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate false;
          open -p ${FTP_PORT} -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" \"${FTP_SERVER}\";
          mkdir -p \"${REMOTE_DIR}\";
          cd \"${REMOTE_DIR}\";
          mirror -R \
            --exclude-glob .git* \
            --exclude-glob .env* \
            --exclude-glob legacy/ \
            build/deploy/ .
          "

      - name: Render runtime .env
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_URL: ${{ vars.APP_URL }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_USER: ${{ vars.ADMIN_USER }}
          ADMIN_PASS_HASH: ${{ secrets.ADMIN_PASS_HASH }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          APP_OWNER: ${{ vars.APP_OWNER }}
          APP_OWNER_ADDRESS: ${{ vars.APP_OWNER_ADDRESS }}
          APP_OWNER_FISCAL_CODE: ${{ vars.APP_OWNER_FISCAL_CODE }}
          APP_OWNER_EMAIL: ${{ vars.APP_OWNER_EMAIL }}
          APP_WEBHOST: ${{ vars.APP_WEBHOST }}
          APP_WEBHOST_LOCATION: ${{ vars.APP_WEBHOST_LOCATION }}
          APP_LOG_RETENTION_DAYS: ${{ vars.APP_LOG_RETENTION_DAYS }}
          APP_BACKUP_RETENTION_DAYS: ${{ vars.APP_BACKUP_RETENTION_DAYS }}
        run: php scripts/render-deploy-env.php build/runtime-env

      - name: Upload production runtime env
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.production-ftp-dir.outputs.path }}
        run: |
          lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate false;
          open -p ${FTP_PORT} -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" \"${FTP_SERVER}\";
          mkdir -p \"${REMOTE_DIR}\";
          cd \"${REMOTE_DIR}\";
          mirror -R build/runtime-env/ .
          "

      - name: Upload Routing .htaccess to Host Root
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate false;
          open -p ${FTP_PORT} -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" \"${FTP_SERVER}\";
          mirror -R build/root-htaccess/ .
          "

      - name: Verify production health and revision
        run: >-
          bash scripts/check-deployment-health.sh
          "${{ vars.PRODUCTION_HEALTH_URL || 'https://www.competizionijudo.it/health' }}"
          "${{ needs.ci.outputs.revision }}"

  deploy-development:
    name: Deploy development
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/dev' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.competizionijudo.it

    steps:
      - name: Checkout deployment verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.ci.outputs.revision }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Download application artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.ci.outputs.artifact-name }}
          path: build/deploy

      - name: Resolve development FTP target directory
        id: development-ftp-dir
        env:
          RAW_FTP_DIR: ${{ vars.FTP_DEV_DIR }}
          DEFAULT_FTP_DIR: dev/
        run: |
          php <<'PHP'
          <?php
          declare(strict_types=1);

          $raw = getenv('RAW_FTP_DIR');
          $default = getenv('DEFAULT_FTP_DIR') ?: 'dev/';
          $value = $raw === false || trim($raw) === '' ? $default : trim($raw);

          if (in_array($value, ['.', './', '/'], true)) {
              fwrite(STDERR, "FTP_DEV_DIR must point to a dedicated application directory relative to the FTP login root, for example dev/." . PHP_EOL);
              exit(1);
          }

          if (str_contains($value, '..')) {
              fwrite(STDERR, "FTP_DEV_DIR must not contain parent-directory segments." . PHP_EOL);
              exit(1);
          }

          $value = ltrim($value, '/');
          $value = preg_replace('#/+#', '/', $value);
          $value = rtrim((string) $value, '/') . '/';

          if ($value === '/') {
              fwrite(STDERR, "FTP_DEV_DIR resolved to the FTP root, which is not allowed." . PHP_EOL);
              exit(1);
          }

          $outputPath = getenv('GITHUB_OUTPUT');
          if ($outputPath === false || $outputPath === '') {
              fwrite(STDERR, "GITHUB_OUTPUT is not available." . PHP_EOL);
              exit(1);
          }

          file_put_contents($outputPath, "path={$value}" . PHP_EOL, FILE_APPEND);
          PHP

      - name: Upload to development FTP directory
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.development-ftp-dir.outputs.path }}
        run: |
          lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate false;
          open -p ${FTP_PORT} -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" \"${FTP_SERVER}\";
          mkdir -p \"${REMOTE_DIR}\";
          cd \"${REMOTE_DIR}\";
          mirror -R \
            --exclude-glob .git* \
            --exclude-glob .env* \
            --exclude-glob legacy/ \
            build/deploy/ .
          "

      - name: Render runtime .env
        env:
          APP_ENV: development
          APP_DEBUG: "false"
          APP_URL: ${{ vars.APP_URL }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          ADMIN_USER: ${{ vars.ADMIN_USER }}
          ADMIN_PASS_HASH: ${{ secrets.ADMIN_PASS_HASH }}
          MAIL_FROM_ADDRESS: ${{ vars.MAIL_FROM_ADDRESS }}
          APP_OWNER: ${{ vars.APP_OWNER }}
          APP_OWNER_ADDRESS: ${{ vars.APP_OWNER_ADDRESS }}
          APP_OWNER_FISCAL_CODE: ${{ vars.APP_OWNER_FISCAL_CODE }}
          APP_OWNER_EMAIL: ${{ vars.APP_OWNER_EMAIL }}
          APP_WEBHOST: ${{ vars.APP_WEBHOST }}
          APP_WEBHOST_LOCATION: ${{ vars.APP_WEBHOST_LOCATION }}
          APP_LOG_RETENTION_DAYS: ${{ vars.APP_LOG_RETENTION_DAYS }}
          APP_BACKUP_RETENTION_DAYS: ${{ vars.APP_BACKUP_RETENTION_DAYS }}
        run: php scripts/render-deploy-env.php build/runtime-env

      - name: Upload development runtime env
        env:
          FTP_SERVER: ${{ vars.FTP_SERVER }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_USERNAME: ${{ vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.development-ftp-dir.outputs.path }}
        run: |
          lftp -c "
          set ftp:ssl-allow true;
          set ftp:ssl-force true;
          set ftp:ssl-protect-data true;
          set ssl:verify-certificate false;
          open -p ${FTP_PORT} -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" \"${FTP_SERVER}\";
          mkdir -p \"${REMOTE_DIR}\";
          cd \"${REMOTE_DIR}\";
          mirror -R build/runtime-env/ .
          "

      - name: Verify development health and revision
        run: >-
          bash scripts/check-deployment-health.sh
          "${{ vars.DEVELOPMENT_HEALTH_URL || 'https://dev.competizionijudo.it/health' }}"
          "${{ needs.ci.outputs.revision }}"