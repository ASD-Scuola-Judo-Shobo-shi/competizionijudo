name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      artifact_name:
        required: false
        type: string
    outputs:
      revision:
        description: Checked out revision used for quality checks and artifact build
        value: ${{ jobs.deploy-artifact.outputs.revision }}
      artifact-name:
        description: Uploaded deployment artifact name
        value: ${{ jobs.deploy-artifact.outputs.artifact-name }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MIGRATION_TEST_DATABASE_PREFIX: competizionijudo_test_ci
      MIGRATION_TEST_HOST: 127.0.0.1
      MIGRATION_TEST_PORT: 3306
      MIGRATION_TEST_USER: root

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Verify action version lock
        run: php scripts/check-workflow-action-lock.php

      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint GitHub Actions workflows
        run: |
          actionlint_path="$(go env GOPATH)/bin/actionlint"
          "$actionlint_path"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, simplexml, pdo_mysql, pcov
          coverage: pcov
          tools: composer:v2

      - name: Validate Composer metadata
        run: composer validate --strict --no-check-lock

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run migration smoke tests
        run: composer test:migrations

      - name: Run quality suite
        run: composer check

      - name: Generate coverage for changed source
        run: |
          mkdir -p build
          vendor/bin/phpunit --coverage-clover build/coverage.xml

      - name: Enforce changed-code coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: php scripts/check-changed-coverage.php build/coverage.xml "${BASE_SHA:-HEAD^}" 70

  deploy-artifact:
    name: Deployment artifact smoke test
    runs-on: ubuntu-latest
    needs: quality
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      artifact-name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve build revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: dom, simplexml
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Build deploy artifact
        env:
          BUILD_REVISION: ${{ steps.revision.outputs.sha }}
        run: bash scripts/build-deploy.sh

      - name: Verify deploy artifact
        run: bash scripts/verify-deploy-artifact.sh build/deploy

      - name: Boot deploy artifact
        run: bash scripts/test-deploy-artifact.sh build/deploy

      - name: Select artifact name
        id: artifact
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: echo "name=${ARTIFACT_NAME:-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" >> "$GITHUB_OUTPUT"

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/deploy
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
