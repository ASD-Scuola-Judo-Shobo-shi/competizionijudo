name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      artifact_name:
        required: false
        type: string
    outputs:
      revision:
        description: Checked out revision used for quality checks and artifact build
        value: ${{ jobs.deploy-artifact.outputs.revision }}
      artifact-name:
        description: Uploaded deployment artifact name
        value: ${{ jobs.deploy-artifact.outputs.artifact-name }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer
      MIGRATION_TEST_DATABASE_PREFIX: competizionijudo_test_ci
      MIGRATION_TEST_HOST: 127.0.0.1
      MIGRATION_TEST_PORT: 3306
      MIGRATION_TEST_USER: root

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          extensions: dom, simplexml, pdo_mysql, pcov
          coverage: pcov
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}/files
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run local CI gate
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: composer ci:quality

  deploy-artifact:
    name: Deployment artifact smoke test
    runs-on: ubuntu-latest
    env:
      COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
      artifact-name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Resolve build revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: "8.4"
          extensions: dom, simplexml
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}/files
          key: composer-${{ runner.os }}-php-8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php-8.4-
            composer-${{ runner.os }}-

      - name: Run shared deployment preflight
        env:
          BUILD_REVISION: ${{ steps.revision.outputs.sha }}
        run: bash scripts/deploy-preflight.sh

      - name: Select artifact name
        id: artifact
        env:
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: echo "name=${ARTIFACT_NAME:-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}}" >> "$GITHUB_OUTPUT"

      - name: Upload application artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/deploy
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
